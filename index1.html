<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Memory Game - Flask + Three.js</title>

    <!-- Bootstrap CSS (CDN, no internal CSS used) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🧠 3D Memory Game</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-9 mx-auto text-center">

                <h1 class="mb-2">Find the Matching Pairs</h1>
                <p class="text-secondary mb-4">
                    Click two cards to flip them. Match all 8 pairs to win!
                </p>

                <!-- Stats bar -->
                <div class="row g-3 mb-3">
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-secondary">
                            <div class="card-body py-2">
                                <div class="text-secondary small">Moves</div>
                                <div id="stat-moves" class="fs-4 fw-bold">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-secondary">
                            <div class="card-body py-2">
                                <div class="text-secondary small">Matches</div>
                                <div id="stat-matches" class="fs-4 fw-bold">0 / 8</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-secondary">
                            <div class="card-body py-2">
                                <div class="text-secondary small">Time</div>
                                <div id="stat-time" class="fs-4 fw-bold">0s</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Progress bar -->
                <div class="progress mb-4" style="height: 10px;">
                    <div id="progress-bar" class="progress-bar bg-success" role="progressbar"
                         style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="8">
                    </div>
                </div>

                <!-- Three.js canvas container -->
                <div class="card bg-secondary bg-opacity-10 border-secondary shadow">
                    <div class="card-body p-0">
                        <div id="scene-container" class="w-100 rounded"
                             style="height: 560px; cursor: pointer;"></div>
                    </div>
                </div>

                <div class="mt-4">
                    <button id="btn-restart" class="btn btn-outline-light px-4">
                        🔄 Restart Game
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-secondary py-4 border-top border-secondary">
        <small>Built with Flask, Bootstrap 5, and Three.js</small>
    </footer>

    <!-- Win Modal -->
    <div class="modal fade" id="winModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">🎉 You Won!</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">You matched all 8 pairs in:</p>
                    <p class="fs-3 fw-bold" id="win-summary">0 moves / 0s</p>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" id="btn-play-again" class="btn btn-success">
                        Play Again
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Internal JS: full game logic -->
    <script>
        // ----------------------------------------------------
        // Setup
        // ----------------------------------------------------
        const container = document.getElementById('scene-container');
        const SYMBOLS = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍋', '🍓', '🥝'];
        const COLS = 4;
        const ROWS = 4;
        const SPACING = 1.6;
        const CARD_SIZE = 1.3;
        const CARD_THICKNESS = 0.12;

        let scene, camera, renderer, raycaster, mouse;
        let cards = [];
        let flippedCards = [];
        let matchesFound = 0;
        let moves = 0;
        let lockBoard = false;
        let startTime = null;
        let timerInterval = null;

        const statMoves = document.getElementById('stat-moves');
        const statMatches = document.getElementById('stat-matches');
        const statTime = document.getElementById('stat-time');
        const progressBar = document.getElementById('progress-bar');
        const winModal = new bootstrap.Modal(document.getElementById('winModal'));

        // ----------------------------------------------------
        // Texture generation (canvas -> Three.js texture)
        // ----------------------------------------------------
        function createFrontTexture(symbol) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#0d6efd';
            ctx.lineWidth = 10;
            ctx.strokeRect(8, 8, 240, 240);

            ctx.font = '130px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, 128, 138);

            return new THREE.CanvasTexture(canvas);
        }

        function createBackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#212529';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#495057';
            ctx.lineWidth = 6;
            for (let i = -256; i < 256; i += 24) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 256, 256);
                ctx.stroke();
            }
            ctx.strokeStyle = '#0d6efd';
            ctx.lineWidth = 10;
            ctx.strokeRect(14, 14, 228, 228);

            return new THREE.CanvasTexture(canvas);
        }

        const backTexture = createBackTexture();

        // ----------------------------------------------------
        // Scene / Camera / Renderer
        // ----------------------------------------------------
        function initScene() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(
                45, container.clientWidth / container.clientHeight, 0.1, 1000
            );
            camera.position.set(0, 0, 9);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(3, 5, 8);
            scene.add(pointLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('click', onCardClick);
            window.addEventListener('resize', onResize);
        }

        function onResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // ----------------------------------------------------
        // Build the deck of cards
        // ----------------------------------------------------
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function buildBoard() {
            // Remove old card meshes
            cards.forEach(c => scene.remove(c.mesh));
            cards = [];
            flippedCards = [];
            matchesFound = 0;
            moves = 0;
            lockBoard = false;

            statMoves.textContent = '0';
            statMatches.textContent = '0 / 8';
            progressBar.style.width = '0%';
            statTime.textContent = '0s';

            let deck = [];
            SYMBOLS.forEach((sym, idx) => {
                deck.push(idx);
                deck.push(idx);
            });
            deck = shuffle(deck);

            const offsetX = ((COLS - 1) * SPACING) / 2;
            const offsetY = ((ROWS - 1) * SPACING) / 2;

            deck.forEach((symbolIndex, i) => {
                const row = Math.floor(i / COLS);
                const col = i % COLS;

                const frontTexture = createFrontTexture(SYMBOLS[symbolIndex]);

                const materials = [
                    new THREE.MeshStandardMaterial({ color: 0x0d6efd }), // right
                    new THREE.MeshStandardMaterial({ color: 0x0d6efd }), // left
                    new THREE.MeshStandardMaterial({ color: 0x0d6efd }), // top
                    new THREE.MeshStandardMaterial({ color: 0x0d6efd }), // bottom
                    new THREE.MeshStandardMaterial({ map: frontTexture }), // front (+z)
                    new THREE.MeshStandardMaterial({ map: backTexture })  // back (-z)
                ];

                const geometry = new THREE.BoxGeometry(CARD_SIZE, CARD_SIZE, CARD_THICKNESS);
                const mesh = new THREE.Mesh(geometry, materials);

                mesh.position.x = col * SPACING - offsetX;
                mesh.position.y = offsetY - row * SPACING;
                mesh.rotation.y = Math.PI; // start showing card back

                scene.add(mesh);

                cards.push({
                    mesh,
                    symbolIndex,
                    state: 'hidden', // hidden | flipped | matched
                    animating: false
                });
            });

            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const secs = Math.floor((Date.now() - startTime) / 1000);
                statTime.textContent = secs + 's';
            }, 1000);
        }

        // ----------------------------------------------------
        // Flip animation (simple tween via requestAnimationFrame)
        // ----------------------------------------------------
        function animateRotation(card, targetY, duration, onComplete) {
            const mesh = card.mesh;
            const startY = mesh.rotation.y;
            const startTimeMs = performance.now();
            card.animating = true;

            function step(now) {
                const t = Math.min((now - startTimeMs) / duration, 1);
                const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease in-out
                mesh.rotation.y = startY + (targetY - startY) * eased;

                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    mesh.rotation.y = targetY;
                    card.animating = false;
                    if (onComplete) onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        function flipUp(card) {
            card.state = 'flipped';
            animateRotation(card, 0, 350);
        }

        function flipDown(card) {
            card.state = 'hidden';
            animateRotation(card, Math.PI, 350);
        }

        function markMatched(card) {
            card.state = 'matched';
            card.mesh.material.forEach(m => {
                if (m.emissive) m.emissive.setHex(0x198754);
            });
        }

        // ----------------------------------------------------
        // Click handling / game logic
        // ----------------------------------------------------
        function onCardClick(event) {
            if (lockBoard) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = cards.map(c => c.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length === 0) return;

            const clickedMesh = intersects[0].object;
            const card = cards.find(c => c.mesh === clickedMesh);

            if (!card || card.state !== 'hidden' || card.animating) return;
            if (flippedCards.length >= 2) return;

            flipUp(card);
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                statMoves.textContent = moves;
                lockBoard = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;

            if (c1.symbolIndex === c2.symbolIndex) {
                markMatched(c1);
                markMatched(c2);
                matchesFound++;
                statMatches.textContent = matchesFound + ' / 8';
                progressBar.style.width = ((matchesFound / 8) * 100) + '%';
                progressBar.setAttribute('aria-valuenow', matchesFound);

                flippedCards = [];
                lockBoard = false;

                if (matchesFound === 8) {
                    clearInterval(timerInterval);
                    const secs = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('win-summary').textContent =
                        moves + ' moves / ' + secs + 's';
                    setTimeout(() => winModal.show(), 400);
                }
            } else {
                setTimeout(() => {
                    flipDown(c1);
                    flipDown(c2);
                    flippedCards = [];
                    lockBoard = false;
                }, 800);
            }
        }

        // ----------------------------------------------------
        // Render loop
        // ----------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // ----------------------------------------------------
        // Init
        // ----------------------------------------------------
        initScene();
        buildBoard();
        animate();

        document.getElementById('btn-restart').addEventListener('click', buildBoard);
        document.getElementById('btn-play-again').addEventListener('click', () => {
            winModal.hide();
            buildBoard();
        });
    </script>
</body>
</html>
